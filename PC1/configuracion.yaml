# Configuración de CyberGuard AI — PC1
# Las rutas relativas se resuelven respecto a la carpeta donde está este archivo (PC1/).

rutas:
  datos_crudos: ../Datasets
  datos_procesados: datos/procesados
  modelos: modelos
  reportes: reportes
  figuras: reportes/figuras
  alertas: datos/en_vivo/alertas.csv
  flujos_analizados: datos/en_vivo/flujos_analizados.csv
  # Captura en vivo (scripts/capturar_en_vivo.py)
  flujos_capturados: datos/en_vivo/flujos_capturados.csv
  estado_captura: datos/en_vivo/estado_captura.json
  # Modelo de laboratorio (scripts/entrenar_modelo_laboratorio.py)
  modelos_laboratorio: modelos/laboratorio
  reportes_laboratorio: reportes/laboratorio
  escenarios_pc2: datos/laboratorio/escenarios_pc2.csv   # copia de PC2/registros/escenarios_ejecutados.csv
  # Experimento log1p: rutas separadas para no sobrescribir el modelo base.
  modelos_log1p: modelos/log1p
  reportes_log1p: reportes/log1p
  # Clasificación de ataques (src/clasificacion/)
  incidentes: datos/en_vivo/incidentes.csv
  modelos_clasificador: modelos/clasificador
  reportes_clasificador: reportes/clasificador

datos:
  # Si la lectura falla con UnicodeDecodeError, cambiar a "latin1".
  codificacion: utf-8
  archivo_entrenamiento: Monday-WorkingHours.pcap_ISCX.csv
  archivos_evaluacion:
    - Tuesday-WorkingHours.pcap_ISCX.csv
    - Wednesday-workingHours.pcap_ISCX.csv
    - Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv
    - Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv
    - Friday-WorkingHours-Morning.pcap_ISCX.csv
    - Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv
    - Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv
  columna_etiqueta: Label
  valor_benigno: BENIGN

# Orden fijo: el modelo siempre recibe las columnas en este orden.
caracteristicas:
  - Flow Duration
  - Total Fwd Packets
  - Total Backward Packets
  - Total Length of Fwd Packets
  - Total Length of Bwd Packets
  - Flow Bytes/s
  - Flow Packets/s
  - Flow IAT Mean
  - SYN Flag Count
  - Destination Port

division:
  proporcion_validacion: 0.2
  semilla: 42

modelo:
  n_estimators: 200
  max_samples: 256
  max_features: 1.0
  contamination: auto
  random_state: 42
  n_jobs: -1   # solo velocidad; no cambia los resultados

umbral:
  fpr_objetivo_validacion: 0.01

# Valores por defecto de scripts/reproducir_flujos.py (se pueden cambiar por línea de comandos).
demo:
  archivos_origen:
    - Monday-WorkingHours.pcap_ISCX.csv
    - Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv
  filas_por_archivo: 25
  intervalo_segundos: 0.5
  semilla: 42

# Captura en vivo (scripts/capturar_en_vivo.py). Requiere Npcap.
captura:
  interfaz: "Wi-Fi"          # ver: python scripts/capturar_en_vivo.py --listar-interfaces
  ip_pc2: "192.168.1.10"     # IP actual de PC2 (cambiará; también se puede pasar --ip-pc2)
  solo_trafico_pc2: true     # false o --todo-el-trafico para capturar todo lo de la interfaz
  timeout_inactividad_segundos: 5   # cierra un flujo tras N s sin paquetes
  timeout_activo_segundos: 120      # duración máxima de un flujo (como CICFlowMeter)
  refresco_panel_segundos: 2        # cada cuánto se actualiza "Monitoreo en vivo"
  modelo: base                      # base (CICIDS2017) o laboratorio; también --modelo

# Modelo de laboratorio: Isolation Forest entrenado con tráfico normal capturado en el laboratorio.
# Usa las mismas 10 características, hiperparámetros (sección modelo), división y FPR objetivo.
laboratorio:
  # Un flujo se etiqueta como ataque si involucra la IP de PC2 de ese escenario y se solapa
  # con su intervalo [inicio - tolerancia, fin + tolerancia] (margen por desfase de relojes).
  tolerancia_segundos: 5
  tipos_ataque: [escaneo_puertos, rafaga_conexiones, mixto_anomalo]   # mixto_anomalo = fase anómala del escenario mixto de PC2
  min_flujos_normales: 200          # por debajo de esto no se entrena (muy pocos datos)

# Clasificación de ataques: reglas por ventana de tiempo e IP (src/clasificacion/reglas.py)
# y Random Forest de familias de CICIDS2017 (scripts/entrenar_clasificador_ataques.py).
clasificacion:
  ventana_segundos: 10                 # flujos de cada IP que se miran juntos
  min_puertos_escaneo: 15              # puertos distintos en la ventana -> escaneo_puertos
  min_conexiones_rafaga: 50            # conexiones TCP cortas al mismo puerto -> rafaga_conexiones
  bytes_transferencia_masiva: 20000    # bytes del servidor en un flujo para considerarlo "grande"
  bytes_ventana_masiva: 5000000        # o bytes acumulados en la ventana -> transferencia_masiva
  inactividad_incidente_segundos: 30   # sin actividad este tiempo, el incidente se da por cerrado
  usar_random_forest: true             # nombra la familia de los ANOMALO sin regla (si está entrenado)
  probabilidad_minima_rf: 0.5          # por debajo, se queda como anomalia_sin_clasificar

archivos_salida:
  modelo: isolation_forest.joblib
  metadatos: metadatos_modelo.json
  metricas: metricas.csv
  metricas_por_tipo: metricas_por_tipo.csv
  modelo_laboratorio: isolation_forest_laboratorio.joblib
  metadatos_laboratorio: metadatos_laboratorio.json
