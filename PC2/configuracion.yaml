# Configuración de PC2 — generador de tráfico de laboratorio.
# TODO el tráfico se dirige únicamente a red.ip_destino_pc1.

red:
  ip_destino_pc1: ""   # OBLIGATORIO: completar con la IP real de PC1 en la red de laboratorio (ej. "192.168.1.7")

ping:
  cantidad: 10
  intervalo_segundos: 1

http:
  # Opcional: requiere que en PC1 se ejecute manualmente `python -m http.server 8000`
  puerto: 8000
  ruta: "/"
  timeout_segundos: 5

escaneo_puertos:
  puerto_inicial: 1
  puerto_final: 1024
  argumentos_nmap: "-sT"   # escaneo TCP connect, no requiere privilegios especiales

rafagas:
  duracion_maxima_segundos: 30   # tope duro; el programa nunca lo supera (y no acepta más de 60)
  conexiones_por_segundo: 20
  concurrencia: 10               # hilos que abren conexiones en paralelo
  timeout_conexion_segundos: 1
  puerto_destino: 8080

# Escenario mixto para la demo (opción 4): normal -> anómalo -> normal.
# Requiere en PC1: python scripts/servidor_demo.py (sirve prueba.txt y grande.bin en http.puerto).
mixto:
  duracion_total_segundos: 300          # 5 min por defecto (se puede cambiar al ejecutarlo)
  duracion_total_maxima_segundos: 900   # tope (el programa no acepta más de 1800)
  proporciones: [0.4, 0.2, 0.4]         # normal inicial, anómala, normal final (300 s -> 120/60/120)
  archivo_normal: "/prueba.txt"         # archivo pequeño: tráfico normal
  archivo_grande: "/grande.bin"         # ~256 KB: el modelo marcó estas descargas como anómalas
  descargas_paralelas: 3
  pausa_normal_min_segundos: 1
  pausa_normal_max_segundos: 4
  pausa_anomala_segundos: 0.2
  incluir_rafaga: true                  # ráfagas en la fase anómala (cada una <= rafagas.duracion_maxima_segundos)

# Escenario aleatorio (opción 5): tráfico normal continuo (usa archivos y pausas de 'mixto')
# y episodios anómalos en momentos, duraciones y tipos al azar.
aleatorio:
  duracion_total_segundos: 300            # tope: mixto.duracion_total_maxima_segundos
  normal_al_inicio_y_final_segundos: 20   # margen solo normal al empezar y al terminar
  pausa_entre_episodios_segundos: [20, 60]
  duracion_episodio_segundos: [5, 20]
  descargas_paralelas: [1, 3]             # intensidad de cada episodio con descargas
  pesos_tipo_episodio: {descargas: 0.5, descargas_y_rafaga: 0.3, rafaga: 0.2}
  semilla: null                           # null = al azar (se imprime para poder repetirla)

registro:
  ruta_csv: "registros/escenarios_ejecutados.csv"   # relativa a la carpeta de este archivo
